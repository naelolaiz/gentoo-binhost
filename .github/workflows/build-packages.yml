name: Build Packages

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  workflow_dispatch:
    inputs:
      package:
        description: 'Single package to build (leave empty to build all)'
        required: false
        default: ''
      # Internal inputs used by the auto-resume mechanism.  Do not set manually.
      _attempt:
        description: '[internal] Resume attempt counter'
        required: false
        default: '1'
      _chain_id:
        description: '[internal] Stable ID linking resume runs together'
        required: false
        default: ''
      _max_attempts:
        description: '[internal] Safety cap on resume attempts'
        required: false
        default: '8'
      fresh:
        description: 'Wipe build caches plus legacy state caches before starting. Only effective on attempt 1 of a manual run; ignored on schedule and on resume.'
        required: false
        type: boolean
        default: false

# Only one build runs at a time; new triggers queue instead of cancelling.
concurrency:
  group: build-packages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write          # needed for auto-resume re-trigger

env:
  # Pinned stage3 tag — included in every cache key so a stage3 update
  # automatically invalidates all caches and forces a clean rebuild.
  # Must match the container.image tag below exactly; the first step in the
  # build job (`Verify stage3 tag consistency`) asserts this and fails RED
  # if they drift.  To upgrade: update BOTH this value AND the
  # container.image value.  See check-stage3.yml for automated staleness
  # notifications.
  STAGE3_TAG: amd64-openrc-20260420
  # Gentoo profile path.  Single source of truth: both the in-workflow
  # `eselect profile set` below and scripts/build.sh receive this via
  # --gentoo-profile so there's no second hardcoded copy to drift.
  GENTOO_PROFILE: default/linux/amd64/23.0/desktop/plasma
  # Build from a clean stage3 plus the official Gentoo binhost.  Do not feed
  # this binhost back into itself while building: one stale or corrupt package
  # in Pages can poison every future run.  Packages built in this workflow are
  # reused only from the current chain's /var/cache/binpkgs cache.
  BINHOST_URLS: https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64-v3/

jobs:
  # ─── Build ──────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    container:
      # Must match STAGE3_TAG in the workflow-level env above.
      image: gentoo/stage3:amd64-openrc-20260420
      options: --privileged
    env:
      CCACHE_SIZE: 20G
      # Pin CCACHE_DIR globally so every step (build.sh, post-build stats,
      # etc.) targets the same directory that the workflow caches.  Without
      # this, ccache silently falls back to ~/.cache/ccache and the restored
      # /var/cache/ccache is unused — observed as "Cache size (GB): 0.0"
      # at the start of every attempt despite a successful cache restore.
      CCACHE_DIR: /var/cache/ccache
    outputs:
      should_continue: ${{ steps.result.outputs.should_continue }}
      chain_id: ${{ steps.meta.outputs.chain_id }}
      next_attempt: ${{ steps.meta.outputs.next_attempt }}

    steps:
      - uses: actions/checkout@v6

      # Assert every stage3 tag reference across all workflows matches the
      # canonical `STAGE3_TAG` env in this file.  Drift means cache keys and
      # the production container image no longer describe the same baseline.
      # See
      # scripts/sync-stage3-tag.sh for the one-command bump tool; this
      # step invokes it in check-only mode.
      - name: Verify stage3 tag consistency
        run: bash scripts/sync-stage3-tag.sh --check "${{ env.STAGE3_TAG }}"

      - name: Set up build metadata
        id: meta
        run: |
          ATTEMPT="${{ inputs._attempt || '1' }}"
          CHAIN_ID="${{ inputs._chain_id || github.run_id }}"
          MAX="${{ inputs._max_attempts || '8' }}"

          # Validate numeric inputs
          for name_val in "attempt:${ATTEMPT}" "max_attempts:${MAX}"; do
            name="${name_val%%:*}"
            val="${name_val##*:}"
            if [[ ! "$val" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Invalid ${name}: '${val}' — must be a positive integer"
              exit 1
            fi
          done
          if [[ "$ATTEMPT" -gt "$MAX" ]]; then
            echo "::error::attempt (${ATTEMPT}) exceeds max_attempts (${MAX})"
            exit 1
          fi

          {
            echo "attempt=${ATTEMPT}"
            echo "chain_id=${CHAIN_ID}"
            echo "next_attempt=$((ATTEMPT + 1))"
          } >> "$GITHUB_OUTPUT"
          if [[ "$ATTEMPT" -gt 1 ]]; then
            echo "::notice::Auto-resumed build (attempt ${ATTEMPT}/${MAX}, chain ${CHAIN_ID})"
          fi

      - name: Validate package input
        if: inputs.package != ''
        run: |
          PKG="${{ inputs.package }}"
          if [[ ! "$PKG" =~ ^[a-zA-Z0-9._-]+/[a-zA-Z0-9._+-]+$ ]]; then
            echo "::error::Invalid package name: ${PKG}"
            echo "Expected format: category/package-name (e.g. dev-qt/qtwebengine)"
            exit 1
          fi

      # Optional manual cache wipe.  When the workflow is dispatched with
      # `fresh: true`, delete every cache this workflow restores before any
      # restore step runs.  Use this when a clean rebuild from the stage3
      # baseline is wanted.
      #
      # Triple-guarded to make this hard to misfire:
      #   * github.event_name == 'workflow_dispatch'  — never on schedule
      #   * inputs.fresh                              — explicit opt-in
      #   * steps.meta.outputs.attempt == '1'         — never on resume
      # The resume re-trigger job already does NOT forward `fresh` in its
      # workflow_dispatch payload, so attempt>1 always sees the default
      # `false`; the attempt guard is defence-in-depth.
      - name: Wipe caches (fresh start)
        if: github.event_name == 'workflow_dispatch' && inputs.fresh && steps.meta.outputs.attempt == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "::warning::fresh=true requested — deleting caches with prefixes: ccache-, binpkgs-, system-state-, build-state-"
          python3 scripts/wipe-caches.py ccache- binpkgs- system-state- build-state-

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: /var/cache/ccache
          key: ccache-${{ env.STAGE3_TAG }}-${{ steps.meta.outputs.chain_id }}-${{ steps.meta.outputs.attempt }}
          restore-keys: |
            ccache-${{ env.STAGE3_TAG }}-${{ steps.meta.outputs.chain_id }}-
            ccache-${{ env.STAGE3_TAG }}-

      # Preserve packages built by earlier attempts in this same chain.  A new
      # chain starts from a clean stage3 plus the official Gentoo binhost; it
      # does not inherit old self-built packages from another run.
      - name: Restore binpkgs
        id: restore_binpkgs
        uses: actions/cache/restore@v5
        with:
          path: /var/cache/binpkgs
          key: binpkgs-${{ env.STAGE3_TAG }}-${{ steps.meta.outputs.chain_id }}-${{ steps.meta.outputs.attempt }}
          restore-keys: |
            binpkgs-${{ env.STAGE3_TAG }}-${{ steps.meta.outputs.chain_id }}-

      - name: Import GPG signing key
        run: |
          if [[ -n "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "$GPG_PRIVATE_KEY" \
              | gpg --batch --passphrase "${GPG_PASSPHRASE:-}" --import
          fi
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sync portage tree
        run: |
          bash scripts/sync-portage.sh
          # Set the profile now so steps before build.sh (e.g. "Install build
          # tools") see the correct profile.  No `|| true`: a wrong/missing
          # profile must fail RED.
          eselect profile set "${{ env.GENTOO_PROFILE }}"

      # Bootstrap Portage binpkg trust.  MUST happen before "Install build
      # tools" because that step fetches signed gpkgs from the official
      # Gentoo binhost.  Logic lives in scripts/setup-binpkg-trust.sh so
      # build.sh uses the same strict getuto-based setup for local runs.
      - name: Set up Portage binpkg trust
        run: bash scripts/setup-binpkg-trust.sh

      # Install ccache for the main build from the official Gentoo binhost,
      # rebuilding from source only if the binary is not usable in this
      # container.
      - name: Install build tools
        env:
          PORTAGE_BINHOST: ${{ env.BINHOST_URLS }}
        run: bash scripts/install-build-tools.sh

      - name: Build packages
        id: build
        run: |
          set +e
          bash scripts/build.sh \
            --profile amd64-23.0-desktop-plasma-openrc \
            --gentoo-profile "${{ env.GENTOO_PROFILE }}" \
            ${{ inputs.package && format('--single-package {0}', inputs.package) || '--package-list packages/packages.txt' }} \
            --binhost-url "${{ env.BINHOST_URLS }}" \
            --state-dir /var/tmp/portage-state \
            --max-build-time 330 \
            ${{ secrets.GPG_PRIVATE_KEY != '' && '--sign' || '' }} \
            ${{ secrets.GPG_PRIVATE_KEY != '' && format('--gpg-key {0}', secrets.GPG_KEY_FINGERPRINT) || '' }} \
            --output-dir /tmp/binpkgs
          BUILD_EXIT=$?
          echo "exit_code=${BUILD_EXIT}" >> "$GITHUB_OUTPUT"
          if [[ $BUILD_EXIT -ne 0 && $BUILD_EXIT -ne 42 ]]; then
            exit $BUILD_EXIT
          fi

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: /var/cache/ccache
          key: ccache-${{ env.STAGE3_TAG }}-${{ steps.meta.outputs.chain_id }}-${{ steps.meta.outputs.attempt }}

      # Save binpkgs even on timeout / failure: any package fully built before
      # the SIGTERM is a real, reusable artifact and must persist for the next
      # resume attempt.  Key includes attempt so each save is unique (otherwise
      # the second use in a chain hits "Unable to reserve cache with key X"
      # and silently drops content); the chain-scoped restore-keys above let
      # the next attempt find it.
      - name: Save binpkgs
        id: save_binpkgs
        if: always()
        uses: actions/cache/save@v5
        with:
          path: /var/cache/binpkgs
          key: binpkgs-${{ env.STAGE3_TAG }}-${{ steps.meta.outputs.chain_id }}-${{ steps.meta.outputs.attempt }}

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: binpkgs-${{ steps.meta.outputs.chain_id }}-${{ steps.meta.outputs.attempt }}
          path: |
            /tmp/binpkgs/**/*.gpkg.tar
            /tmp/binpkgs/**/*.asc
            /tmp/binpkgs/_failures/**
          if-no-files-found: warn
          retention-days: 7

      - name: Determine if build should continue
        id: result
        if: always()
        run: |
          EXIT="${{ steps.build.outputs.exit_code || '1' }}"
          MAX="${{ inputs._max_attempts || '8' }}"
          NEXT="${{ steps.meta.outputs.next_attempt }}"
          NEW_PKGS="${{ steps.build.outputs.new_package_count || '0' }}"
          FAILED="${{ steps.build.outputs.failed_package_count || '0' }}"

          echo "exit=${EXIT} new_pkgs=${NEW_PKGS} failed=${FAILED} next=${NEXT}/${MAX}"

          # A real package failure is not a resume condition.  build.sh has
          # already uploaded _failures/<cat>/<pkg>/build.log and emitted the
          # annotations; stop red so the package/config issue is visible.
          if [[ "$FAILED" -gt 0 ]]; then
            echo "::error title=Package build failure::${FAILED} package(s) failed. See annotations above and _failures/ in the build artifact."
            exit 1
          fi

          # Continue only for clean timeouts.  Long packages like
          # qtwebengine/webkit-gtk may be interrupted by the time budget; the
          # next attempt reuses completed binpkgs and ccache.
          should_continue=false
          if [[ "$EXIT" == "42" && "$NEXT" -le "$MAX" ]]; then
            should_continue=true
          fi
          echo "should_continue=${should_continue}" >> "$GITHUB_OUTPUT"

          if [[ "$EXIT" == "42" && "$NEXT" -gt "$MAX" ]]; then
            echo "::error::Build did not complete after ${MAX} attempts."
            exit 1
          fi

  # ─── Publish to GitHub Pages ────────────────────────────────────
  publish:
    needs: build
    if: always() && !cancelled()
    uses: ./.github/workflows/publish-to-pages.yml
    with:
      chain_id: ${{ needs.build.outputs.chain_id }}
    secrets: inherit

  # ─── Auto-resume: re-trigger if the build timed out ─────────────
  continue:
    needs: [build, publish]
    if: always() && !cancelled() && needs.build.outputs.should_continue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-trigger build to continue where it left off
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ needs.build.outputs.next_attempt }}
          CHAIN_ID: ${{ needs.build.outputs.chain_id }}
          MAX: ${{ inputs._max_attempts || '8' }}
          PACKAGE: ${{ inputs.package }}
          REF: ${{ github.ref_name }}
        run: |
          echo "Resuming build (attempt ${NEXT}/${MAX}, chain ${CHAIN_ID})"
          gh workflow run build-packages.yml \
            --repo "${{ github.repository }}" \
            --ref "${REF}" \
            -f "package=${PACKAGE}" \
            -f "_attempt=${NEXT}" \
            -f "_chain_id=${CHAIN_ID}" \
            -f "_max_attempts=${MAX}"
