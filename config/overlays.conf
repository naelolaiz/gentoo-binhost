# Ebuild repositories used next to the Gentoo tree, one per line:
#
#   <name> <GitHub URL>
#
# <name> is the repository's own name (its profiles/repo_name).  The builder,
# the install check and scripts/use-closure.sh add every repository listed
# here, so a package from it can be a tier root.  A machine that installs
# such a package needs the same repository (eselect repository enable <name>).
#
# Binary packages from these repositories are published like any other, as
# long as their licence allows it (RESTRICT=bindist and config/no-publish.txt
# still apply).

# Steam (games-util/steam-launcher), tier 26-steam.  Upstream plans to move
# steam-launcher into the Gentoo tree and retire the overlay; drop this line
# then.
steam-overlay https://github.com/anyc/steam-overlay
