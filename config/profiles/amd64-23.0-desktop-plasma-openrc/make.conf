# Gentoo binhost — amd64 23.0 desktop/plasma (OpenRC), testing keywords.
#
# Everything in this file decides whether a machine accepts a binary package
# from the binhost: Portage only installs a binary whose USE flags (including
# the USE_EXPAND variables below) equal what the machine itself would build.
# A machine that wants the binaries uses the same values; where it differs,
# it compiles the affected packages itself.
#
# Builder-only settings (FEATURES, MAKEOPTS, signing, ccache) are not here;
# scripts/container-build.sh adds them inside the build container.

# Code generation.  The baseline is deliberately generic: packages run on
# any x86-64-v3 CPU (roughly 2015 and newer) and on every CI runner.  CFLAGS
# are not compared when a binary is installed, so a machine may keep its own
# -march for the packages it compiles locally.
COMMON_FLAGS="-march=x86-64-v3 -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Unlike CFLAGS these are USE flags and must match.  The list is what
# x86-64-v3 guarantees, plus AES/PCLMUL which every such CPU in use has.
CPU_FLAGS_X86="aes avx avx2 bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt sse sse2 sse3 sse4_1 sse4_2 ssse3"

ACCEPT_KEYWORDS="~amd64"
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"

USE="elogind openrc"
USE="${USE} X wayland kde"
USE="${USE} jack lv2 alsa pipewire pulseaudio ladspa sfv2 fftw libsamplerate osc rubberband aubio dssi sndfile vorbis flac"
USE="${USE} hackrf v4l x265 heif jpeg2k gphoto2 ffmpeg djvu markdown epub mobi imagemagick theora wavpack matroska"
USE="${USE} openexr opencl openal"

L10N="es en en-US"

VIDEO_CARDS="amdgpu radeonsi"
INPUT_DEVICES="libinput wacom"
LLVM_TARGETS="AMDGPU X86"
GRUB_PLATFORMS="efi-64 pc"

# PYTHON_TARGETS / PYTHON_SINGLE_TARGET are intentionally not set: the
# profile's default is what the stage3 and the official binhost are built
# with.
