# Settings shared by the build workflow, the builder and the consumer check.
# Plain KEY=value lines: sourced by bash and read by the workflow.

# Directory under config/profiles/ holding the Portage configuration.
PROFILE_NAME=amd64-23.0-desktop-plasma-openrc
# Gentoo profile, as accepted by `eselect profile set`.
GENTOO_PROFILE=default/linux/amd64/23.0/desktop/plasma

# Official Gentoo binhost used next to our own (same -march level).
OFFICIAL_BINHOST=https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64-v3

# Container image every run starts from.  A rolling tag: nothing persistent
# depends on a particular stage3, and a continuation run pins the exact image
# of the run it continues by digest.
STAGE3_IMAGE=docker.io/gentoo/stage3:amd64-desktop-openrc

# Compiler cache size.  Must stay below the 10 GB a repository gets for
# GitHub Actions caches, since it is the only thing stored there.
CCACHE_MAX_SIZE=9G
